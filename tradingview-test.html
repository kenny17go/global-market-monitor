<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071422">
<title>市場觀察 · TradingView 測試</title>
<style>
:root{--bg:#071422;--panel:#0b1c2d;--line:#173b58;--text:#eaf3fb;--muted:#8da7bc;--accent:#1ea7ff}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#06111d,#081827 35%,#071422);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;min-height:100vh}.wrap{max-width:1180px;margin:auto;padding:18px}.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;margin-bottom:14px}.head h1{font-size:21px;margin:0}.head p{margin:5px 0 0;color:var(--muted);font-size:12px}.badge{border:1px solid #275b83;border-radius:999px;padding:6px 9px;color:#9fd8ff;font-size:11px}.cards{display:grid;grid-template-columns:repeat(6,minmax(130px,1fr));gap:10px}.card{appearance:none;-webkit-appearance:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;text-align:left;background:linear-gradient(180deg,#0b1c2d,#0a1a29);border:1px solid var(--line);border-radius:10px;color:var(--text);padding:13px;cursor:pointer;min-height:92px;width:100%}.card:hover,.card.active{border-color:var(--accent);background:#0d2942}.card small{display:block;color:var(--muted);margin-top:3px;pointer-events:none}.card b{display:block;font-size:18px;margin-top:10px;pointer-events:none}.hint{font-size:10px;color:#68a8d3;margin-top:5px;pointer-events:none}.viewer{display:none;margin-top:12px;background:#0a1a29;border:1px solid var(--line);border-radius:10px;overflow:hidden}.viewer.open{display:block}.viewer-head{height:48px;padding:0 12px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.viewer-title{font-weight:750}.viewer-title small{font-weight:400;color:var(--muted);margin-left:7px}.close{background:#0d2b46;border:1px solid #275b83;color:#cfe9fb;border-radius:7px;padding:7px 10px;cursor:pointer;touch-action:manipulation}.tv{height:540px}.loading{height:100%;display:grid;place-items:center;color:var(--muted);font-size:13px}.note{margin-top:12px;color:var(--muted);font-size:11px;line-height:1.55}@media(max-width:850px){.wrap{padding:10px}.head{align-items:flex-start;flex-direction:column}.cards{grid-template-columns:repeat(2,1fr)}.card{min-height:88px}.tv{height:62vh;min-height:430px}.viewer{position:relative}.viewer-head{position:sticky;top:0;z-index:2;background:#0a1a29}}
</style>
</head>
<body><main class="wrap">
<div class="head"><div><h1>市場快覽 · TradingView 圖表測試</h1><p>只測試互動與手機版顯示，不改 Global Market Monitor 正式行情來源。</p></div><span class="badge">TEST BRANCH · FIX 2</span></div>
<section class="cards" id="cards"></section>
<section class="viewer" id="viewer"><div class="viewer-head"><div class="viewer-title" id="viewerTitle"></div><button type="button" class="close" id="closeBtn">關閉 ×</button></div><div id="tv" class="tv"></div></section>
<p class="note">測試方式：點任一市場卡展開 TradingView 圖表；再點同一張卡或「關閉」收起。USD/TWD、Forward、NDF 與正式 Dashboard 均未變更。</p>
</main>
<script>
(function(){
const markets=[
 {id:'SPX',name:'S&P 500',symbol:'SP:SPX',sub:'美國大型股'},
 {id:'SOX',name:'SOX',symbol:'NASDAQ:SOX',sub:'費城半導體'},
 {id:'TAIEX',name:'TAIEX',symbol:'TWSE:TAIEX',sub:'台灣加權'},
 {id:'NIKKEI',name:'Nikkei 225',symbol:'TVC:NI225',sub:'日本股市'},
 {id:'GOLD',name:'Gold',symbol:'OANDA:XAUUSD',sub:'黃金現貨'},
 {id:'WTI',name:'WTI',symbol:'TVC:USOIL',sub:'西德州原油'}
];
const cards=document.getElementById('cards');
const viewer=document.getElementById('viewer');
const tv=document.getElementById('tv');
const title=document.getElementById('viewerTitle');
let active='';
function closeViewer(){active='';viewer.classList.remove('open');Array.from(document.querySelectorAll('.card')).forEach(function(x){x.classList.remove('active')});tv.innerHTML=''}
function openMarket(m){
 if(active===m.id){closeViewer();return}
 active=m.id;
 Array.from(document.querySelectorAll('.card')).forEach(function(x){x.classList.toggle('active',x.getAttribute('data-id')===m.id)});
 title.innerHTML=m.name+'<small>'+m.symbol+'</small>';
 viewer.classList.add('open');
 tv.innerHTML='<div class="loading">TradingView 圖表載入中…</div>';
 const host=document.createElement('div');host.className='tradingview-widget-container';host.style.height='100%';host.style.width='100%';
 const inner=document.createElement('div');inner.className='tradingview-widget-container__widget';inner.style.height='100%';inner.style.width='100%';host.appendChild(inner);
 const s=document.createElement('script');s.type='text/javascript';s.src='https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';s.async=true;
 s.innerHTML=JSON.stringify({autosize:true,symbol:m.symbol,interval:'D',timezone:'Asia/Taipei',theme:'dark',style:'1',locale:'zh_TW',allow_symbol_change:false,calendar:false,support_host:'https://www.tradingview.com'});
 s.onload=function(){const loading=tv.querySelector('.loading');if(loading)loading.remove()};
 host.appendChild(s);tv.innerHTML='';tv.appendChild(host);
 setTimeout(function(){viewer.scrollIntoView({behavior:'smooth',block:'start'})},80);
}
markets.forEach(function(m){
 const btn=document.createElement('button');btn.type='button';btn.className='card';btn.setAttribute('data-id',m.id);btn.innerHTML='<small>'+m.sub+'</small><b>'+m.name+'</b><div class="hint">點擊查看 TradingView</div>';
 btn.addEventListener('click',function(ev){ev.preventDefault();openMarket(m)},false);
 btn.addEventListener('touchend',function(ev){ev.preventDefault();openMarket(m)},false);
 cards.appendChild(btn);
});
document.getElementById('closeBtn').addEventListener('click',function(ev){ev.preventDefault();closeViewer()});
})();
</script></body></html>
