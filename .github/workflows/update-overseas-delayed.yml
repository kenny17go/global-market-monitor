name: Update overseas delayed data

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch-overseas-delayed.mjs'
      - 'scripts/fetch-overview-commodities.mjs'
      - '.github/workflows/update-overseas-delayed.yml'
  schedule:
    - cron: '2,7,12,17,22,27,32 1-5 * * 1-5'
      timezone: "Asia/Taipei"
    - cron: '2,7,12,17,22,27,32 9-16 * * 1-5'
      timezone: "America/New_York"

permissions:
  contents: write

concurrency:
  group: update-overseas-delayed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch Yahoo / JPX delayed futures and cash indices
        run: node scripts/fetch-overseas-delayed.mjs
      - name: Fetch commodity spot and futures
        run: node scripts/fetch-overview-commodities.mjs
      - name: Validate market data
        run: |
          node --check scripts/fetch-overseas-delayed.mjs
          node --check scripts/fetch-overview-commodities.mjs
          node -e "const d=JSON.parse(require('fs').readFileSync('data/overseas-delayed.json','utf8')); const idx=Object.values(d.indices||{}).filter(x=>x.last!=null); const intraday=Object.values(d.indices||{}).filter(x=>Array.isArray(x.series)&&x.series.length>=2); const taiex=d.indices?.TAIEX,topix=d.indices?.TOPIX; const fut=['CME_MES','CME_MNQ','CME_SOX','JPX_NIKKEI225_MINI','JPX_MINI_TOPIX'].filter(k=>d.products?.[k]?.contracts?.length); if(idx.length<4||!Array.isArray(taiex?.series)||taiex.series.length<2||topix?.last==null) { console.error('required index validation failed',{taiexPoints:taiex?.series?.length||0,topixLast:topix?.last,topixPoints:topix?.series?.length||0}); process.exit(1); } console.log('valid cash indices:',idx.length,'real intraday series:',intraday.length,'TAIEX points:',taiex.series.length,'TOPIX points:',topix.series?.length||0,'overview futures:',fut.length);"
          node -e "const d=JSON.parse(require('fs').readFileSync('data/commodities-latest.json','utf8')); const rows=Object.values(d.commodities||{}); const fut=rows.filter(x=>x.future?.last!=null).length; const spot=rows.filter(x=>x.spot?.last!=null).length; if(rows.length<6||fut<6) process.exit(1); console.log('commodity rows:',rows.length,'commodity futures:',fut,'available spot/reference quotes:',spot);"
      - name: Commit delayed data
        run: |
          git add data/overseas-delayed.json data/commodities-latest.json
          if git diff --cached --quiet; then
            echo "No delayed-data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh real 1D 5m overview series and market data"
          git pull --rebase origin main
          git push
