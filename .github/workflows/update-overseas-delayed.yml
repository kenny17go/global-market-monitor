name: Update overseas delayed data

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch-overseas-delayed.mjs'
      - 'scripts/fetch-overview-commodities.mjs'
      - 'scripts/patch-overview-equities.mjs'
      - 'scripts/patch-overview-commodities.mjs'
      - 'providers.js'
      - 'app.js'
      - 'styles.css'
      - '.github/workflows/update-overseas-delayed.yml'
  schedule:
    - cron: '*/15 * * * 1-5'

permissions:
  contents: write

concurrency:
  group: update-overseas-delayed
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install overview equity bridge
        run: node scripts/patch-overview-equities.mjs
      - name: Install overview commodity bridge
        run: node scripts/patch-overview-commodities.mjs
      - name: Fetch Yahoo / JPX delayed futures and cash indices
        run: node scripts/fetch-overseas-delayed.mjs
      - name: Fetch commodity spot and futures
        run: node scripts/fetch-overview-commodities.mjs
      - name: Validate market data
        run: |
          node --check scripts/fetch-overseas-delayed.mjs
          node --check scripts/fetch-overview-commodities.mjs
          node --check scripts/patch-overview-equities.mjs
          node --check scripts/patch-overview-commodities.mjs
          node --check providers.js
          node --check app.js
          node -e "const d=JSON.parse(require('fs').readFileSync('data/overseas-delayed.json','utf8')); const idx=Object.values(d.indices||{}).filter(x=>x.last!=null); const intraday=Object.values(d.indices||{}).filter(x=>Array.isArray(x.series)&&x.series.length>=2); const fut=['CME_MES','CME_MNQ','CME_SOX','JPX_NIKKEI225_MINI','JPX_MINI_TOPIX'].filter(k=>d.products?.[k]?.contracts?.length); if(idx.length<4||intraday.length<4) process.exit(1); console.log('valid cash indices:',idx.length,'real intraday series:',intraday.length,'overview futures:',fut.length);"
          node -e "const d=JSON.parse(require('fs').readFileSync('data/commodities-latest.json','utf8')); const rows=Object.values(d.commodities||{}); const fut=rows.filter(x=>x.future?.last!=null).length; const spot=rows.filter(x=>x.spot?.last!=null).length; if(rows.length<6||fut<6) process.exit(1); console.log('commodity rows:',rows.length,'commodity futures:',fut,'available spot/reference quotes:',spot);"
          grep -q "mergeOverviewEquities(base,delayed,taifex)" providers.js
          grep -q "data.seriesMeta\[m.idx\]" providers.js
          grep -q "盤中線暫無資料" app.js
          grep -q "real-intraday-sparklines" styles.css
          grep -q "mergeOverviewCommodities(base,commodityData)" providers.js
          grep -q "'天然氣':'NATGAS'" providers.js
          grep -q "commodities-latest.json" providers.js
      - name: Commit delayed data
        run: |
          git add data/overseas-delayed.json data/commodities-latest.json scripts/fetch-overseas-delayed.mjs providers.js app.js styles.css
          if git diff --cached --quiet; then
            echo "No delayed-data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh real 1D 5m overview series and market data"
          git push
