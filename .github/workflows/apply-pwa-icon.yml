name: Apply PWA Icon
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-pwa-icon.yml'
      - 'scripts/patch-pwa-icons.mjs'
      - 'apple-touch-icon-v2.png'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: apply-pwa-icon
  cancel-in-progress: true
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply versioned PWA icon links
        run: node scripts/patch-pwa-icons.mjs
      - name: Verify links
        run: |
          grep -q 'apple-touch-icon-v2.png' index.html
          grep -q 'manifest.webmanifest?v=20260917b' index.html
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'fix: activate new iPhone home screen icon'
          git pull --rebase origin main
          git push origin main