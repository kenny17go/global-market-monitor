name: Fix sparkline data sources

on:
  push:
    paths:
      - '.github/workflows/fix-sparkline-sources.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch market fetchers
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p=Path('scripts/fetch-overseas-delayed.mjs')
          s=p.read_text(encoding='utf-8')
          start=s.index('async function yahooIndexQuote(')
          end=s.index('\nasync function tradingViewContracts', start)
          new=r'''async function yahooIndexQuote(id,symbol,label,range){
  try{
    const j=await fetchJson(`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?interval=5m&range=5d`);
    const r=j?.chart?.result?.[0],m=r?.meta;
    const last=valid(m?.regularMarketPrice,range),prev=valid(m?.chartPreviousClose??m?.previousClose,range);
    if(last==null)throw new Error('missing market price');
    const change=prev!=null?last-prev:null,pct=prev?change/prev*100:null;
    const ts=Array.isArray(r?.timestamp)?r.timestamp:[];
    const close=Array.isArray(r?.indicators?.quote?.[0]?.close)?r.indicators.quote[0].close:[];
    const all=[];
    for(let i=0;i<Math.min(ts.length,close.length);i++){
      const t=Number(ts[i]),v=valid(close[i],range);
      if(Number.isFinite(t)&&v!=null)all.push({t,v});
    }
    const tz=m?.exchangeTimezoneName||'UTC', groups=new Map();
    for(const x of all){const k=localDateKey(x.t,tz);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)}
    const sessions=[...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0]));
    const latest=sessions.at(-1), previous=sessions.at(-2);
    const chosen=(latest?.[1]?.length>=24||!previous)?latest:previous;
    const points=chosen?.[1]||[];
    return {id,symbol,label,last,previousClose:prev,change,pct,
      timestamp:m?.regularMarketTime?new Date(m.regularMarketTime*1000).toISOString():new Date().toISOString(),
      source:'Yahoo Finance',mode:'DELAYED',series:points.map(x=>x.v),seriesTimes:points.map(x=>new Date(x.t*1000).toISOString()),
      seriesMeta:{range:'1D',interval:'5m',session:chosen?.[0]||'LATEST_SESSION',source:'Yahoo Finance',mode:'DELAYED',timezone:tz,points:points.length,usedPreviousSession:chosen===previous}}
  }catch(e){console.warn('Yahoo index failed',id,symbol,e.message);return {id,symbol,label,last:null,previousClose:null,change:null,pct:null,timestamp:null,source:'Yahoo Finance',mode:'UNAVAILABLE',series:[],seriesTimes:[],seriesMeta:{range:'1D',interval:'5m',session:'LATEST_SESSION',source:'Yahoo Finance',mode:'UNAVAILABLE',points:0}}}
}

async function yahooJapanTopix(){
  try{
    const html=await fetchText('https://finance.yahoo.co.jp/quote/998405.T');
    const plain=stripHtml(html);
    const m=plain.match(/TOPIX[\s\S]{0,1200}?([0-9]{1,2},[0-9]{3}\.[0-9]{2})/);
    const last=valid(m?.[1],[100,10000]); if(last==null)throw new Error('TOPIX value not found');
    const pm=plain.match(/前日比[\s\S]{0,200}?([+\-−]?\s*[0-9,]+\.[0-9]{2})\s*\(([+\-−]?\s*[0-9.]+)%\)/);
    const change=pm?num(pm[1].replace('−','-').replace(/\s/g,'')):null;
    const pct=pm?num(pm[2].replace('−','-').replace(/\s/g,'')):null;
    return {id:'TOPIX',symbol:'998405.T',label:'東證 TOPIX',last,previousClose:change!=null?last-change:null,change,pct,timestamp:new Date().toISOString(),source:'Yahoo!ファイナンス Japan',mode:'PUBLIC WEB QUOTE',series:[],seriesTimes:[],seriesMeta:{range:'1D',interval:'5m',source:'Yahoo!ファイナンス Japan',mode:'UNAVAILABLE',points:0,note:'Cash index quote available; no synthetic intraday series.'}}
  }catch(e){console.warn('Yahoo Japan TOPIX fallback failed',e.message);return null}
}'''
          s=s[:start]+new+s[end:]
          old="const indices={};for(const x of INDEX_TARGETS)indices[x.id]=await yahooIndexQuote(x.id,x.symbol,x.label,x.range);"
          new2=old+"\nif(indices.TOPIX?.last==null){const t=await yahooJapanTopix();if(t)indices.TOPIX=t;}"
          if old not in s: raise SystemExit('indices marker not found')
          s=s.replace(old,new2,1)
          p.write_text(s,encoding='utf-8')

          p=Path('scripts/fetch-overview-commodities.mjs')
          s=p.read_text(encoding='utf-8')
          start=s.index('async function yahooChart(')
          end=s.index('\nasync function stooqQuote', start)
          new=r'''function localDateKey(sec,timeZone){try{return new Intl.DateTimeFormat('en-CA',{timeZone:timeZone||'UTC',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(sec*1000))}catch{return new Date(sec*1000).toISOString().slice(0,10)}}
async function yahooChart(symbol,range,label){
  try{
    const j=await fetchJson(`https://query1.finance.yahoo.com/v8/finance/chart/${encodeURIComponent(symbol)}?interval=5m&range=5d`);
    const r=j?.chart?.result?.[0],m=r?.meta;
    const last=inRange(m?.regularMarketPrice,range),prev=inRange(m?.chartPreviousClose??m?.previousClose,range);
    if(last==null)throw new Error('missing market price');
    const change=prev!=null?last-prev:null,pct=prev?change/prev*100:null;
    const ts=Array.isArray(r?.timestamp)?r.timestamp:[],close=Array.isArray(r?.indicators?.quote?.[0]?.close)?r.indicators.quote[0].close:[];
    const all=[];for(let i=0;i<Math.min(ts.length,close.length);i++){const t=Number(ts[i]),v=inRange(close[i],range);if(Number.isFinite(t)&&v!=null)all.push({t,v})}
    const tz=m?.exchangeTimezoneName||'UTC',groups=new Map();for(const x of all){const k=localDateKey(x.t,tz);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(x)}
    const sessions=[...groups.entries()].sort((a,b)=>a[0].localeCompare(b[0])),latest=sessions.at(-1),previous=sessions.at(-2),chosen=(latest?.[1]?.length>=24||!previous)?latest:previous,points=chosen?.[1]||[];
    return {label,symbol,last,previousClose:prev,change,pct,timestamp:m?.regularMarketTime?new Date(m.regularMarketTime*1000).toISOString():new Date().toISOString(),source:'Yahoo Finance',mode:'DELAYED',series:points.map(x=>x.v),seriesTimes:points.map(x=>new Date(x.t*1000).toISOString()),seriesMeta:{range:'1D',interval:'5m',session:chosen?.[0]||'LATEST_SESSION',source:'Yahoo Finance',mode:'DELAYED',timezone:tz,points:points.length,usedPreviousSession:chosen===previous,instrument:'FUTURES'}}
  }catch(e){console.warn('Yahoo commodity quote failed',label,symbol,e.message);return {label,symbol,last:null,previousClose:null,change:null,pct:null,timestamp:null,source:'Yahoo Finance',mode:'UNAVAILABLE',series:[],seriesTimes:[],seriesMeta:{range:'1D',interval:'5m',source:'Yahoo Finance',mode:'UNAVAILABLE',points:0,instrument:'FUTURES'}}}
}'''
          s=s[:start]+new+s[end:]
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commit fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '4189826+github-actions[bot]@users.noreply.github.com'
          git add scripts/fetch-overseas-delayed.mjs scripts/fetch-overview-commodities.mjs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Fix sparkline sessions, TOPIX quote and Brent history'
          git push
