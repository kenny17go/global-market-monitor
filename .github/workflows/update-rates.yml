name: Update rates and bond yields

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch-overview-rates.mjs'
      - '.github/workflows/update-rates.yml'
  schedule:
    - cron: '17 * * * 1-5'

permissions:
  contents: write

concurrency:
  group: update-rates
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch official policy rates and US Treasury yield curve
        run: node scripts/fetch-overview-rates.mjs
      - name: Validate rates data
        run: |
          node --check scripts/fetch-overview-rates.mjs
          node -e "const d=JSON.parse(require('fs').readFileSync('data/rates-latest.json','utf8')); const need=['1M','3M','6M','1Y','2Y','5Y','10Y','30Y']; const ok=need.filter(t=>d.ust?.find(x=>x.tenor===t&&x.yield!=null)); const pr=d.policyRates||[]; if(ok.length<8||pr.length<7||pr.filter(x=>x.displayRate&&x.displayRate!=='—').length<6) process.exit(1); console.log('UST tenors:',ok.length,'policy rates:',pr.length,'asOf:',d.meta?.asOf);"
      - name: Commit rates data only
        run: |
          git add data/rates-latest.json
          if git diff --cached --quiet; then
            echo "No rates data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh official policy rates and UST curve"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main || exit 1
            if git push; then exit 0; fi
            echo "Push raced with another data workflow; retry $attempt/4"
            sleep $((attempt * 2))
          done
          echo "Failed to push after retries"
          exit 1
