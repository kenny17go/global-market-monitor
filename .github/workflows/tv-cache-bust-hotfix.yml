name: TradingView cache-bust hotfix

on:
  push:
    paths:
      - '.github/workflows/tv-cache-bust-hotfix.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update TradingView script cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = 'tv-spark-widget.js?v=20260917-tvwidget1'
          new = 'tv-spark-widget.js?v=20260917-indexfix2'
          if old not in s:
              print('Old cache key not found; nothing to change')
          else:
              p.write_text(s.replace(old, new), encoding='utf-8')
              print('Updated TradingView script cache key')
          PY
      - name: Commit hotfix
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Bust TradingView widget cache for index hotfix'
          git push
