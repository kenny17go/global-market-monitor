name: Replace TradingView JPX source

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/replace-tradingview-jpx-source.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replace JPX TradingView fallback
        run: |
          node <<'NODE'
          const fs=require('fs');
          let s=fs.readFileSync('scripts/fetch-overseas-delayed.mjs','utf8');
          const start=s.indexOf('async function tradingViewContracts(');
          const end=s.indexOf('async function nikkei225jpMini()',start);
          if(start<0||end<0) throw new Error('TradingView JPX block not found');
          const replacement=`async function barchartProduct({symbols,range,label}){
            const key=process.env.BARCHART_API_KEY||'';
            if(!key)return {defaultMonth:null,contracts:[],source:'Barchart OnDemand',mode:'UNAVAILABLE',note:'BARCHART_API_KEY not configured'};
            try{
              const fields='bidPrice,askPrice,tradeTimestamp,expirationDate';
              const url='https://ondemand.websol.barchart.com/getQuote.json?apikey='+encodeURIComponent(key)+'&symbols='+encodeURIComponent(symbols)+'&fields='+encodeURIComponent(fields);
              const j=await fetchJson(url),rows=Array.isArray(j?.results)?j.results:[];
              const contracts=[];
              for(const q of rows){
                const exp=String(q.expirationDate||'');
                const em=exp.match(/(20\\d{2})[-/](\\d{1,2})/);
                const month=em?em[1]+String(em[2]).padStart(2,'0'):symbolMonth(String(q.symbol||'')+'.X');
                const last=valid(q.lastPrice,range),bid=valid(q.bidPrice,range),ask=valid(q.askPrice,range);
                if(month&&(last!=null||bid!=null||ask!=null))contracts.push({symbol:q.symbol,month,bid,ask,last,timestamp:q.tradeTimestamp||j?.status?.serverTimestamp||new Date().toISOString(),quoteType:label+' · Barchart delayed quote'});
              }
              contracts.sort((a,b)=>a.month.localeCompare(b.month));
              return {defaultMonth:contracts[0]?.month||null,contracts,source:'Barchart OnDemand · '+label,mode:contracts.length?'DELAYED':'UNAVAILABLE'};
            }catch(e){console.warn('Barchart JPX failed',label,e.message);return {defaultMonth:null,contracts:[],source:'Barchart OnDemand · '+label,mode:'UNAVAILABLE'}}
          }
          `;
          s=s.slice(0,start)+replacement+s.slice(end);
          s=s.replace("products.JPX_MINI_TOPIX=await tradingViewContracts({id:'JPX_MINI_TOPIX',url:'https://tw.tradingview.com/symbols/OSE-TOPIXM1!/contracts/',prefix:'TOPIXM',range:[100,10000]});\nproducts.JPX_NIKKEI225_MINI=await tradingViewContracts({id:'JPX_NIKKEI225_MINI',url:'https://tw.tradingview.com/symbols/OSE-NK225M1!/contracts/',prefix:'NK225M',range:[1000,100000]});\nif(!products.JPX_NIKKEI225_MINI.contracts.length)products.JPX_NIKKEI225_MINI=await nikkei225jpMini();",
          "products.JPX_MINI_TOPIX=await barchartProduct({symbols:'TS*0,TS*1,TS*2',range:[100,10000],label:'JPX mini-TOPIX'});\nproducts.JPX_NIKKEI225_MINI=await barchartProduct({symbols:'NP*0,NP*1,NP*2',range:[1000,100000],label:'JPX Nikkei 225 mini'});\nif(!products.JPX_NIKKEI225_MINI.contracts.length)products.JPX_NIKKEI225_MINI=await nikkei225jpMini();");
          s=s.replace("source:'Yahoo Finance + JPX delayed fallbacks'","source:'Yahoo Finance + Barchart OnDemand + JPX public fallbacks'");
          s=s.replace(/JPX\/OSE fallbacks expose delayed last prices\/contract months only and do not synthesize Bid\/Ask\./,"JPX/OSE uses Barchart OnDemand when configured; Nikkei 225 mini falls back to a public last-price table. No Bid/Ask is synthesized.");
          fs.writeFileSync('scripts/fetch-overseas-delayed.mjs',s);

          let w=fs.readFileSync('.github/workflows/update-overseas-delayed.yml','utf8');
          w=w.replace("      - name: Fetch Yahoo / JPX delayed futures and cash indices\n        run: node scripts/fetch-overseas-delayed.mjs","      - name: Fetch Yahoo / JPX delayed futures and cash indices\n        env:\n          BARCHART_API_KEY: ${{ secrets.BARCHART_API_KEY }}\n        run: node scripts/fetch-overseas-delayed.mjs");
          fs.writeFileSync('.github/workflows/update-overseas-delayed.yml',w);
          NODE
      - name: Verify
        run: |
          node --check scripts/fetch-overseas-delayed.mjs
          grep -q "barchartProduct" scripts/fetch-overseas-delayed.mjs
          ! grep -q "tradingViewContracts" scripts/fetch-overseas-delayed.mjs
          grep -q "BARCHART_API_KEY" .github/workflows/update-overseas-delayed.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/fetch-overseas-delayed.mjs .github/workflows/update-overseas-delayed.yml
          git commit -m "data: replace TradingView JPX fallback with Barchart-ready source chain"
          git pull --rebase origin main
          git push
