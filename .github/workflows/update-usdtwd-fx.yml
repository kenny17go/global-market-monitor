name: Update USD TWD FX curves

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch-usdtwd-fx.mjs'
      - 'scripts/apply-bot-onshore-fallback.mjs'
      - 'scripts/apply-fx-v1.mjs'
      - 'scripts/patch-taifex-settlement-ndf.mjs'
      - 'scripts/patch-ndf-runtime-cache.mjs'
      - 'scripts/patch-ndf-formula-tokens.mjs'
      - 'scripts/patch-formula-category-filter.mjs'
      - 'scripts/fix-usdtwd-toggle.mjs'
      - 'scripts/patch-fx-v11.mjs'
      - '.github/workflows/update-usdtwd-fx.yml'
  schedule:
    - cron: '3,18,33,48 * * * 1-5'

permissions:
  contents: write

concurrency:
  group: update-usdtwd-fx
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch USD TWD spot and curves
        run: node scripts/fetch-usdtwd-fx.mjs
      - name: Apply BOT plain-text onshore fallback
        run: node scripts/apply-bot-onshore-fallback.mjs
      - name: Apply USD TWD panel
        run: node scripts/apply-fx-v1.mjs
      - name: Install TAIFEX settlement NDF panel
        run: node scripts/patch-taifex-settlement-ndf.mjs
      - name: Force-refresh NDF frontend assets
        run: node scripts/patch-ndf-runtime-cache.mjs
      - name: Install settlement NDF formula tokens
        run: node scripts/patch-ndf-formula-tokens.mjs
      - name: Install Formula Lab category filter
        run: node scripts/patch-formula-category-filter.mjs
      - name: Install USD TWD toggle binding
        run: node scripts/fix-usdtwd-toggle.mjs
      - name: Apply FX V1.1 labels
        run: node scripts/patch-fx-v11.mjs
      - name: Validate
        run: |
          node -e "const d=JSON.parse(require('fs').readFileSync('data/usdtwd-fx.json','utf8')); if(!d.offshore||!d.offshore.curve) process.exit(1);"
          node --check app.js
          node --check scripts/patch-taifex-settlement-ndf.mjs
          node --check scripts/patch-ndf-runtime-cache.mjs
          node --check scripts/patch-ndf-formula-tokens.mjs
          node --check scripts/patch-formula-category-filter.mjs
          grep -q "function syncUsdtwdVisibility" app.js
          grep -q "function renderTaifexSettlementNdf" app.js
          grep -q "TAIFEX settlement NDF render failed" app.js
          grep -q "TGF_NEAR_NDF" app.js
          grep -q "BRF_NEXT_NDF" app.js
          grep -q "tokenCategory" index.html
          grep -q "tokenCategory" app.js
          grep -q "app.js?v=20260916-formula-cat1" index.html
          grep -q "taifexSettlementNdf" index.html
          grep -q "DOMContentLoaded',syncUsdtwdVisibility" app.js
          grep -q "toggleUsdtwdFx" index.html
          grep -q "usdtwdFxPanel" index.html
      - name: Commit FX data and UI
        run: |
          git add data/usdtwd-fx.json index.html app.js providers.js styles.css
          if git diff --cached --quiet; then
            echo "No FX changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh USD TWD FX curves and Formula Lab filters"
          git push
