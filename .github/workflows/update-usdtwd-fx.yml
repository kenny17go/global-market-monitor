name: Update USD TWD FX curves

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch-usdtwd-fx.mjs'
      - 'scripts/apply-bot-onshore-fallback.mjs'
      - 'scripts/apply-fx-v1.mjs'
      - 'scripts/patch-taifex-settlement-ndf.mjs'
      - 'scripts/patch-ndf-runtime-cache.mjs'
      - 'scripts/patch-ndf-formula-tokens.mjs'
      - 'scripts/patch-formula-category-filter.mjs'
      - 'scripts/patch-custom-indicators.mjs'
      - 'scripts/patch-indicator-dashboard.mjs'
      - 'scripts/patch-overview-major-fx.mjs'
      - 'scripts/patch-overview-equities.mjs'
      - 'scripts/patch-overview-commodities.mjs'
      - 'scripts/patch-overview-rates.mjs'
      - 'scripts/patch-ust-yield-panel.mjs'
      - 'scripts/fix-usdtwd-toggle.mjs'
      - 'scripts/patch-fx-v11.mjs'
      - '.github/workflows/update-usdtwd-fx.yml'
  schedule:
    - cron: '3,18,33,48 0-17 * * 1-5'
      timezone: "Asia/Taipei"

permissions:
  contents: write

concurrency:
  group: update-usdtwd-fx
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch USD TWD spot and curves
        run: node scripts/fetch-usdtwd-fx.mjs
      - name: Apply BOT plain-text onshore fallback
        run: node scripts/apply-bot-onshore-fallback.mjs
      - name: Validate refreshed FX data and runtime
        run: |
          node -e "const d=JSON.parse(require('fs').readFileSync('data/usdtwd-fx.json','utf8')); if(!d.spot||d.spot.mid==null||!d.offshore||!d.offshore.curve) process.exit(1); console.log('USD/TWD spot:',d.spot.mid,'generated:',d.meta?.generatedAt);"
          node --check scripts/fetch-usdtwd-fx.mjs
      - name: Commit FX data
        run: |
          git add data/usdtwd-fx.json
          if git diff --cached --quiet; then
            echo "No FX changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh USD TWD FX curves and preserve overview market bridges"
          git push
