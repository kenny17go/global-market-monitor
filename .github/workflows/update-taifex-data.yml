name: Update TAIFEX official data

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch-taifex.mjs'
      - 'scripts/install-taifex-official.mjs'
      - 'scripts/patch-ui-target.mjs'
      - '.github/workflows/update-taifex-data.yml'
  schedule:
    - cron: '35 7 * * 1-5'
    - cron: '35 21 * * 1-5'

permissions:
  contents: write

concurrency:
  group: update-taifex-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official TAIFEX integration and fetch data
        run: node scripts/install-taifex-official.mjs
      - name: Apply UI target patch
        run: node scripts/patch-ui-target.mjs
      - name: Validate JavaScript
        run: |
          node --check app.js
          node --check providers.js
          node --check scripts/patch-ui-target.mjs
      - name: Commit integration/data changes
        run: |
          if git diff --quiet -- app.js providers.js config.example.js index.html data/latest.json data/taifex-latest.json; then
            echo "No TAIFEX changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js providers.js config.example.js index.html data/latest.json data/taifex-latest.json
          git commit -m "feat: simplify TAIEX label and show contract underlying"
          git push
