name: Update TAIFEX official data

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/fetch-taifex.mjs'
      - '.github/workflows/update-taifex-data.yml'
  schedule:
    - cron: '35 7 * * 1-5'
    - cron: '35 21 * * 1-5'

permissions:
  contents: write

concurrency:
  group: update-taifex-data
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Fetch TAIFEX official data
        run: node scripts/fetch-taifex.mjs
      - name: Validate TAIFEX data
        run: |
          node --check scripts/fetch-taifex.mjs
          node -e "const d=JSON.parse(require('fs').readFileSync('data/taifex-latest.json','utf8')); const need=['TX','MTX','SPF','UNF','UDF','SXF','TJF','F1F','RHF','XEF','XJF','XBF','XAF','GDF','TGF','BRF']; const ok=need.filter(k=>Array.isArray(d.products?.[k]?.contracts)&&d.products[k].contracts.length); if(ok.length<12) process.exit(1); console.log('TAIFEX products with contracts:',ok.length,'generated:',d.meta?.generatedAt);"
      - name: Commit TAIFEX data only
        run: |
          git add data/taifex-latest.json
          if git diff --cached --quiet; then
            echo "No TAIFEX data changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh TAIFEX official data"
          git pull --rebase origin main
          git push
