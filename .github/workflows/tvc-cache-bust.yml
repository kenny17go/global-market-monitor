name: TVC widget cache bust
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/tvc-cache-bust.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update TV widget cache key
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text()
          ns,n=re.subn(r'tv-spark-widget\.js\?v=[^"\']+', 'tv-spark-widget.js?v=20260917-tvc-all1', s)
          if not n:
              ns,n=re.subn(r'tv-spark-widget\.js', 'tv-spark-widget.js?v=20260917-tvc-all1', s, count=1)
          if not n:
              raise SystemExit('tv-spark-widget.js reference not found')
          p.write_text(ns)
          print('updated',n,'reference(s)')
          PY
      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Bust cache for TVC TradingView widgets"
          git push
